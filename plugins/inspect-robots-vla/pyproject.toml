[build-system]
requires = ["hatchling>=1.18", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-vla"
version = "0.1.0"
description = "VLA policies for Inspect Robots: the umi-replay policy speaking the :10055 RLT inference wire, and the Astra-planner hybrid that delegates skill segments to it."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Inspect Robots contributors" }]
keywords = ["robotics", "vla", "umi-replay", "hybrid", "inspect_robots", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# No torch and no vendor SDK: the adapter speaks the serve_rlt_inference HTTP
# wire (NPZ over httpx), mirroring the "speak the protocol, don't import the
# package" doctrine of the agent and xpolicylab plugins. scipy is the anchor
# module's rpy/rot6d math.
dependencies = [
    "inspect-robots>=0.44",
    "numpy>=1.24",
    "scipy>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

# Entry-point discovery: an installed inspect-robots-vla appears in
# `inspect-robots list policies` without being imported first. The registry
# calls this factory by the name `umi-replay`.
[project.entry-points."inspect_robots.policies"]
umi-replay = "inspect_robots_vla:umi_replay"

[project.urls]
Homepage = "https://github.com/robocurve/inspect-robots/tree/main/plugins/inspect-robots-vla"
Repository = "https://github.com/robocurve/inspect-robots"

# In the Inspect Robots monorepo this resolves the `inspect_robots` dependency
# to the in-repo core package instead of PyPI. Harmless in a standalone
# checkout (uv ignores a workspace source when there is no workspace root).
[tool.uv.sources]
inspect-robots = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_vla"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_vla", "tests", "README.md"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_vla"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true

# scipy's transform module is untyped upstream; only _anchor imports it.
[[tool.mypy.overrides]]
module = ["scipy.spatial.transform.*"]
ignore_missing_imports = true

# PyPI readme: identical to README.md except GitHub-only alert syntax
# (e.g. `> [!NOTE]`) is rewritten into bold blockquotes, which PyPI renders.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!NOTE\][ \t]*$'
replacement = '> **Note:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!WARNING\][ \t]*$'
replacement = '> **Warning:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!CAUTION\][ \t]*$'
replacement = '> **Caution:**'
